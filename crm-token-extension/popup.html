<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PalFish Token Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      padding: 14px 16px;
    }
    .header h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
    .header p { font-size: 11px; color: #bfdbfe; margin-top: 2px; }
    .body { padding: 14px 16px; }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      background: #1e293b; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.idle  { background: #64748b; }
    .dot.ok    { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }
    .dot.error { background: #ef4444; box-shadow: 0 0 6px #ef444480; }
    .status-text { font-size: 12px; color: #94a3b8; }
    .status-text strong { color: #e2e8f0; display: block; font-size: 13px; margin-bottom: 1px; }
    .stat {
      background: #1e293b; border-radius: 8px; padding: 8px 12px;
      font-size: 11px; color: #64748b;
    }
    .stat span { color: #38bdf8; font-weight: 600; }
    .config {
      margin-top: 10px;
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .config label {
      display: block;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .config input {
      width: 100%;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 8px 9px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .config button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      background: #2563eb;
      color: #eff6ff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .config small {
      display: block;
      margin-top: 6px;
      color: #64748b;
      line-height: 1.5;
      font-size: 10px;
    }
    .hint {
      margin-top: 10px; font-size: 11px; color: #475569;
      line-height: 1.5;
    }
    .hint a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔄 PalFish Token Sync</h1>
    <p>Đồng bộ cookie CRM → Backend</p>
  </div>
  <div class="body">
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <div class="status-text">
        <strong id="status-title">Đang tải…</strong>
        <span id="status-msg"></span>
      </div>
    </div>
    <div class="stat">
      Tổng lần đồng bộ: <span id="sync-count">0</span>
    </div>
    <div class="config">
      <label for="ingest-token">Extension Secret</label>
      <input id="ingest-token" type="password" placeholder="Dán CRM_EXTENSION_INGEST_TOKEN" />
      <button id="save-token" type="button">Lưu Secret</button>
      <small>Chỉ cần dán một lần sau khi cài hoặc cập nhật extension.</small>
    </div>
    <p class="hint">
      Truy cập <strong>sea.pri.ibanyu.com</strong> và thực hiện bất kỳ thao tác nào
      để extension tự động bắt token.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
